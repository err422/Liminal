<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liminal</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<canvas id="view"></canvas>

<main id="menu" class="screen">
  <h1>liminal</h1>
  <p class="tag">You came here with three friends. Count again.</p>
  <label>Your name <input id="name" maxlength="14" placeholder="Player" autocomplete="off"></label>
  <div class="row"><button id="host">Host a room</button><button id="solo" class="quiet">Play solo</button></div>
  <div class="row"><input id="joincode" maxlength="5" placeholder="Room code" autocomplete="off" spellcheck="false"><button id="join">Join</button></div>
  <p id="err" class="err" role="alert"></p>
  <p class="keys">W A S D move · Shift sprint · F flashlight · E interact · Click to capture mouse</p>
</main>

<main id="lobby" class="screen" hidden>
  <h2>Room <span id="code"></span></h2>
  <p class="tag">Share this code. Up to four players.</p>
  <ul id="plist"></ul>
  <button id="start" hidden>Enter the maze</button>
  <p id="wait" hidden class="tag">Waiting for the host to start…</p>
</main>

<div id="hud" hidden>
  <div id="net"></div>
  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="bars">
    <div class="bar" title="Health (left) and insanity (right)"><i id="bar-hp"></i><i id="bar-ins"></i></div>
    <div class="mini"><span>Battery</span><div><i id="battery-fill"></i></div></div>
    <div class="mini"><span>Stamina</span><div><i id="stamina-fill"></i></div></div>
  </div>
  <div id="banner" hidden><h2 id="banner-title"></h2><p id="banner-sub"></p><button id="again">Back to menu</button></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
